[package]
name = "kestrel-cli"
version = "0.1.0"
description = "Headless web page screenshots for CI and agents"
authors = ["Florian Wartner"]
edition = "2024"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
headless_chrome = { version = "1.0.22", default-features = false }
anyhow = "1"
base64 = "0.22"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
