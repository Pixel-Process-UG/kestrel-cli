name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Real captures with the runner's preinstalled Chrome and no display.
      - name: Smoke capture
        shell: bash
        run: |
          printf '<h1 id="t">kestrel</h1>' > page.html
          cargo run -q -- shot page.html https://example.com --full-page --viewport 390x844 -o shots --json
          test -s shots/page.html.png && test -s shots/example.com.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
